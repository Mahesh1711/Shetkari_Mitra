<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShetkariMitra - Login & Signup</title>
    <link rel="shortcut icon" href="img/ShetkariMitra_logo.png" type="image/x-icon">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.slim.min.js"></script>
    <style>
        body {
    font-family: Arial, sans-serif;
    background-color:#ffff
                no-repeat center center fixed;
    background-size: cover; /* Ensures the image covers the entire screen */
    background-position: center; /* Centers the image */
    background-attachment: fixed; /* Keeps the background fixed while scrolling */
    background-repeat: no-repeat; /* Prevents the image from repeating */
    height: 100vh; /* Full viewport height */
    width: 100vw; /* Full viewport width */
    margin: 0;
    padding: 0;
    display: flex;
    justify-content: center;
    align-items: center;
}

        .container {
            background: url('img/logocontainer_bg.jpg') no-repeat center center;
            background-size: cover;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            text-align: center;
            width: 400px;
            position: relative;
            color: white;
        }
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            border-radius: 10px;
        }
        .content {
            position: relative;
            z-index: 1;
        }
        .container img {
            width: 100px;
            margin-bottom: 15px;
        }
        .container h2 {
            margin-bottom: 20px;
            font-size: 24px;
        }
        .input-group {
            margin-bottom: 20px;
            position: relative;
        }
        .input-group input {
            width: 100%;
            padding: 15px;
            padding-left: 50px;
            font-size: 16px;
            border: 2px solid #ccc;
            border-radius: 8px;
            box-sizing: border-box;
        }
        .input-group i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: gray;
            font-size: 18px;
        }
        .btn {
            width: 100%;
            padding: 15px;
            font-size: 18px;
            border: none;
            background-color: #28a745;
            color: white;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.3s;
        }
        .btn:hover {
            background-color: #218838;
        }
        .links {
            margin-top: 15px;
        }
        .links a {
            color: white;
            text-decoration: none;
            font-size: 14px;
        }
        .links a:hover {
            text-decoration: underline;
        }
        .hidden {
            display: none;
        }
    </style>
</head>
<body>


<div class="container">
    <div class="overlay"></div>
    <div class="content">
        <img src="img/ShetkariMitra_logo.png" alt="ShetkariMitra Logo">

        <!-- Login Form -->
        <div id="login-form">
            <h2><i class="fa-solid fa-user-lock"></i> Login</h2>
            <div class="input-group">
                <i class="fa-solid fa-user"></i>
                <input type="text" id="login-email" name="email" placeholder="Username">
            </div>
            <div class="input-group">
                <i class="fa-solid fa-lock"></i>
                <input type="password" id="login-password" name="password" placeholder="Password">
            </div>
            <button class="btn" onclick="login()">Login</button>
            <div class="links">
                <a href="#" onclick="toggleForm('signup-form')">Create an Account</a> |
                <a href="#" onclick="toggleForm('forgot-form')">Forgot Password?</a>
            </div>
        </div>

        <!-- Sign Up Form -->
        <div id="signup-form" class="hidden">
            <h2><i class="fa-solid fa-user-plus"></i> Sign Up</h2>
            <div class="input-group">
                <i class="fa-solid fa-user"></i>
                <input type="text" id="signup-username" name="name" placeholder="Username">
            </div>
            <div class="input-group">
                <i class="fa-solid fa-phone"></i>
                <input type="tel" id="signup-phone" name="number" placeholder="Phone Number">
            </div>

            <div class="input-group">
                <i class="fa-solid fa-envelope"></i>
                <input type="email" id="signup-email" name="email" placeholder="Email">
            </div>
            <div class="input-group">
                <i class="fa-solid fa-lock"></i>
                <input type="password" id="signup-password" name="password" placeholder="Password">
            </div>
            <button class="btn" onclick="signup()">Sign Up</button>
            <div class="links">
                <a href="#" onclick="toggleForm('login-form')">Back to Login</a>
            </div>
        </div>

        <!-- Forgot Password Form -->
        <div id="forgot-form" class="hidden">
            <h2><i class="fa-solid fa-key"></i> Reset Password</h2>

            <div class="input-group">
                <i class="fa-solid fa-envelope fa-solid fa-phone" id="contact-icon"></i>
                <input type="text" id="forgot-contact" placeholder="Enter your email or phone number">
            </div>

            <button class="btn" onclick="resetPassword()">Send Reset Link</button>

            <div class="links">
                <a href="#" onclick="toggleForm('login-form')">Back to Login</a>
            </div>
        </div>

    </div>

    <script>
        function login() {
            var email = document.getElementById("login-email").value.trim();
            var password = document.getElementById("login-password").value.trim();

            fetch("http://127.0.0.1:8000/api/login", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "Accept": "application/json"
            },
            body: JSON.stringify({
                email: email,
                password: password
            })
        })
        .then(response => {
            if (!response.ok) {
                throw new Error("Invalid login credentials");
            }
            return response.json();
        })
        .then(data => {
            alert("Login successful!");
            window.location.href = "index.html"; // redirect to homepage
        })
        .catch(error => {
            console.error("Login error:", error);
            alert("Login failed! Please check your credentials.");
        });

<!--            if (username === "admin" && password === "1234") {-->
<!--                window.location.href = "index.html";-->
<!--            } else {-->
<!--                alert("Invalid credentials! Try again.");-->
<!--            }-->
        }

        function signup() {
            var username = document.getElementById("signup-username").value.trim();
            var phone = document.getElementById("signup-phone").value.trim();
            var email = document.getElementById("signup-email").value.trim();
            var password = document.getElementById("signup-password").value.trim();
            if (!username || !phone || !password) {
                alert("Username, Phone Number, and Password are required!");
                return;
            }

            if (!/^\d{10}$/.test(phone)) {
                alert("Phone number must be exactly 10 digits!");
                return;
            }

            if (email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
                alert("Please enter a valid email address!");
                return;
            }

            fetch("http://127.0.0.1:8000/api/register", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "Accept": "application/json"
            },
            body: JSON.stringify({
                name: username,
                mobile_number: phone,
                email: email,
                password: password
            })
        })
        .then(response => {
            if (!response.ok) {
                throw new Error("Network response was not ok");
            }
            return response.json();
        })
        .then(data => {
            alert("Signup successful! Message: " + data.message);
            toggleForm('login-form');
        })
        .catch(error => {
            console.error("API Error:", error);
            alert("Something went wrong. Please try again.");
        });

<!--            alert("Signup successful! Redirecting to login...");-->
<!--            toggleForm('login-form');-->
        }

        function resetPassword() {
            var contact = document.getElementById("forgot-contact").value.trim();
            const isEmail = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(contact);
            const isPhone = /^\d{10}$/.test(contact);

            if (!isEmail && !isPhone) {
                alert("Please enter a valid email or 10-digit phone number!");
                return;
            }

            alert("Password reset link sent to your " + (isEmail ? "email." : "phone number."));
            toggleForm('login-form');
        }

        function toggleForm(formId) {
            document.getElementById("login-form").classList.add("hidden");
            document.getElementById("signup-form").classList.add("hidden");
            document.getElementById("forgot-form").classList.add("hidden");

            document.getElementById(formId).classList.remove("hidden");
        }

    </script>

</div>
</body>
</html>
